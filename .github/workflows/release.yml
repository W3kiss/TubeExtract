name: Release

# Builds the Windows app on GitHub's servers and attaches it to a release.
# Trigger: Actions tab -> Release -> "Run workflow" (enter a tag such as v0.1.0),
# or push a tag like v0.1.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build (portable exe + NSIS installer)
        run: npm run tauri build -- --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir dist
          cp src-tauri/target/release/tubeextract.exe dist/TubeExtract.exe
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TubeExtract-windows
          path: dist/*

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "TubeExtract $TAG" \
              --notes "**TubeExtract.exe** — portable app, just run it. \`*-setup.exe\` — installer. On first launch the app downloads yt-dlp, FFmpeg and Deno into its own folder."
          fi
          gh release upload "$TAG" dist/* --clobber
